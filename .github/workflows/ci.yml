# Security regression CI: coding standards, unit tests on every supported PHP
# version, integration tests on the oldest and newest supported WordPress (single
# site and multisite), and an end-to-end smoke test of a real site over HTTP.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    # Weekly, so a new WordPress release that breaks something is noticed.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Coding standards, docs and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - run: composer install --no-progress --no-interaction
      - name: Coding standards (WordPress + PHP 8.1 compatibility)
        run: vendor/bin/phpcs -q
      - name: Settings reference in readme.txt is current
        run: php bin/readme-settings.php --check
      - name: Release build (versions agree, zip and checksums)
        run: bin/build.sh --skip-tests
      - uses: actions/upload-artifact@v5
        with:
          name: sentinel-shield-zip
          path: dist/sentinel-shield-*.zip*
          retention-days: 14

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - run: composer install --no-progress --no-interaction
      - run: vendor/bin/phpunit --testsuite unit

  integration:
    name: Integration (PHP ${{ matrix.php }}, WP ${{ matrix.wp }}${{ matrix.multisite == '1' && ', multisite' || '' }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', wp: '6.4.5', multisite: '0' }
          - { php: '8.1', wp: '6.4.5', multisite: '1' }
          - { php: '8.3', wp: 'latest', multisite: '0' }
          - { php: '8.3', wp: 'latest', multisite: '1' }
          - { php: '8.4', wp: 'latest', multisite: '0' }
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WP_TESTS_DIR: /tmp/wp-tests/tests-lib
      WP_MULTISITE: ${{ matrix.multisite }}
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, sodium
          tools: composer
          coverage: none
      - run: composer install --no-progress --no-interaction
      - name: Install WordPress ${{ matrix.wp }} and its test library
        run: bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }} /tmp/wp-tests
      - run: vendor/bin/phpunit --testsuite integration

  smoke:
    name: Smoke test (real site over HTTP)
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, sodium
          tools: wp-cli
          coverage: none
      - name: Create a throwaway site with the plugin active
        run: |
          # The official tarball: wp core download can cut paths over 100 characters on some systems.
          mkdir -p /tmp/site && curl -fsSL https://wordpress.org/latest.tar.gz | tar -xz -C /tmp/site --strip-components=1
          wp config create --path=/tmp/site --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 \
            --extra-php <<< "define( 'WP_DEBUG', true ); define( 'WP_DEBUG_DISPLAY', true );"
          wp core install --path=/tmp/site --url=http://127.0.0.1:8099 --title=Smoke --admin_user=admin \
            --admin_password="$(openssl rand -hex 16)" --admin_email=admin@example.org --skip-email
          ln -s "$GITHUB_WORKSPACE" /tmp/site/wp-content/plugins/sentinel-shield
          wp plugin activate sentinel-shield --path=/tmp/site
      - name: Start PHP's web server
        run: |
          (cd /tmp/site && php -S 127.0.0.1:8099 -t . > /tmp/server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8099/ && exit 0; sleep 1; done
          cat /tmp/server.log; exit 1
      - run: bin/smoke-test.sh /tmp/site http://127.0.0.1:8099
      - name: Server log
        if: failure()
        run: tail -100 /tmp/server.log
